# Push a tag like v1.0.0 → build a universal Yeet.app, publish it to B2 + GitHub Release, update the website.
#   git tag v1.0.0 && git push origin v1.0.0
#
# Jobs (tag runs): check → build → publish (B2 + GitHub Release) → website (render + deploy to the VPS).
# Each version lives on B2 at yeet/releases/<version>/ and is never overwritten: a tag whose version is
# already on B2 fails in `check`. If `website` fails, use "Re-run failed jobs" — it reads the checksum
# back from B2, so it does not need a rebuild.
#
# Website only: push a tag like web/1.0.0/1 → render + deploy the website at that commit for version
# 1.0.0, which must already be on B2. No build, no B2 upload, no GitHub Release. Bump the last part
# for every redeploy (web/1.0.0/2, …).
#   git tag web/1.0.0/1 && git push origin web/1.0.0/1
#
# Repository secrets: B2_KEY_ID, B2_APP_KEY (key limited to prefix yeet/: listFiles, readFiles, writeFiles),
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_KNOWN_HOSTS, DEPLOY_SSH_KEY (forced-command key → ci-deploy.sh).
# Repository variables: B2_ENDPOINT (https://s3.<region>.backblazeb2.com), B2_BUCKET.
name: Release

on:
  push:
    tags: ["v*", "web/*/*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 1.0.0). Manual runs upload an artifact, no release."
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  B2_PREFIX: yeet/releases
  # AWS CLI ≥ 2.23 sends CRC checksums by default; keep requests plain S3 for B2
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  AWS_DEFAULT_REGION: us-east-1

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      web_only: ${{ steps.v.outputs.web_only }}
    steps:
      - name: Resolve version
        id: v
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          WEB_ONLY=false
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == web/* ]]; then
            WEB_ONLY=true
            VERSION="${GITHUB_REF_NAME#web/}"
            VERSION="${VERSION%%/*}"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$INPUT_VERSION"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::Invalid version '$VERSION'"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "web_only=$WEB_ONLY" >> "$GITHUB_OUTPUT"

      - name: Require a version that is complete on B2 (website only)
        if: steps.v.outputs.web_only == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APP_KEY }}
          B2_ENDPOINT: ${{ vars.B2_ENDPOINT }}
          B2_BUCKET: ${{ vars.B2_BUCKET }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          for v in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY B2_ENDPOINT B2_BUCKET; do
            [[ -n "${!v}" ]] || { echo "::error::$v is empty — check repository secrets B2_KEY_ID/B2_APP_KEY and variables B2_ENDPOINT/B2_BUCKET"; exit 1; }
          done
          # SHA256SUMS.txt is uploaded last, so its presence means the version is complete
          aws s3api head-object --endpoint-url "$B2_ENDPOINT" --bucket "$B2_BUCKET" \
            --key "$B2_PREFIX/$VERSION/SHA256SUMS.txt" > /dev/null \
            || { echo "::error::$B2_PREFIX/$VERSION/SHA256SUMS.txt not found on B2 — release v$VERSION first."; exit 1; }
          echo "$B2_PREFIX/$VERSION/ is on B2"

      - name: Refuse a version that is already on B2
        if: github.ref_type == 'tag' && steps.v.outputs.web_only != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APP_KEY }}
          B2_ENDPOINT: ${{ vars.B2_ENDPOINT }}
          B2_BUCKET: ${{ vars.B2_BUCKET }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          for v in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY B2_ENDPOINT B2_BUCKET; do
            [[ -n "${!v}" ]] || { echo "::error::$v is empty — check repository secrets B2_KEY_ID/B2_APP_KEY and variables B2_ENDPOINT/B2_BUCKET"; exit 1; }
          done
          n=$(aws s3api list-objects-v2 --endpoint-url "$B2_ENDPOINT" --bucket "$B2_BUCKET" \
                --prefix "$B2_PREFIX/$VERSION/" --max-keys 1 --query 'KeyCount' --output text)
          if [[ "$n" != "0" ]]; then
            echo "::error::$B2_PREFIX/$VERSION/ already exists on B2 — versions are never overwritten. Tag a new version."
            exit 1
          fi
          echo "$B2_PREFIX/$VERSION/ is free"

  build:
    needs: check
    if: needs.check.outputs.web_only != 'true'
    runs-on: macos-15
    env:
      VERSION: ${{ needs.check.outputs.version }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Build Yeet.app (universal, ad-hoc signed)
        run: |
          xcodebuild -version
          xcodebuild build \
            -project Yeet.xcodeproj -scheme Yeet -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DD \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
          APP=build/DD/Build/Products/Release/Yeet.app
          lipo -archs "$APP/Contents/MacOS/Yeet"
          codesign --verify --deep --strict "$APP"
          mkdir -p dist && cp -R "$APP" dist/

      - name: Package .zip and .dmg
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent Yeet.app "Yeet-$VERSION.zip"
          mkdir dmg && cp -R Yeet.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Yeet $VERSION" -srcfolder dmg -ov -format UDZO "Yeet-$VERSION.dmg"
          shasum -a 256 "Yeet-$VERSION.zip" "Yeet-$VERSION.dmg" | tee SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yeet-${{ env.VERSION }}
          path: |
            dist/Yeet-*.zip
            dist/Yeet-*.dmg
            dist/SHA256SUMS.txt

  publish:
    needs: [check, build]
    if: github.ref_type == 'tag' && needs.check.outputs.web_only != 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
      AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APP_KEY }}
      B2_ENDPOINT: ${{ vars.B2_ENDPOINT }}
      B2_BUCKET: ${{ vars.B2_BUCKET }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Yeet-${{ needs.check.outputs.version }}
          path: dist

      - name: Upload to B2 (yeet/releases/<version>/, never overwrite)
        run: |
          cd dist
          shasum -a 256 -c SHA256SUMS.txt
          DEST="s3://$B2_BUCKET/$B2_PREFIX/$VERSION"
          # Checked again here: `check` ran before a ~10-minute build
          n=$(aws s3api list-objects-v2 --endpoint-url "$B2_ENDPOINT" --bucket "$B2_BUCKET" \
                --prefix "$B2_PREFIX/$VERSION/" --max-keys 1 --query 'KeyCount' --output text)
          [[ "$n" == "0" ]] || { echo "::error::$DEST/ appeared during the build — refusing to overwrite"; exit 1; }
          aws s3 cp --endpoint-url "$B2_ENDPOINT" "Yeet-$VERSION.dmg" "$DEST/Yeet-$VERSION.dmg" --content-type application/x-apple-diskimage
          aws s3 cp --endpoint-url "$B2_ENDPOINT" "Yeet-$VERSION.zip" "$DEST/Yeet-$VERSION.zip" --content-type application/zip
          # SHA256SUMS last: the website job treats its presence as "this version is complete"
          aws s3 cp --endpoint-url "$B2_ENDPOINT" SHA256SUMS.txt "$DEST/SHA256SUMS.txt" --content-type "text/plain; charset=utf-8"
          aws s3 ls --endpoint-url "$B2_ENDPOINT" "$DEST/"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          ## Yeet $VERSION

          Universal build (Apple Silicon + Intel), macOS 14+.

          **First launch:** this build is ad-hoc signed, not notarized. Right-click Yeet.app → **Open**,
          or run \`xattr -dr com.apple.quarantine /Applications/Yeet.app\`.
          NOTES
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
            "dist/Yeet-$VERSION.dmg" "dist/Yeet-$VERSION.zip" dist/SHA256SUMS.txt \
            --title "Yeet $VERSION" --notes-file notes.md --generate-notes

  website:
    needs: [check, publish]
    # always(): run even though publish is skipped on a website-only tag, but never after a failure
    if: >-
      always() && github.ref_type == 'tag' && needs.check.result == 'success'
      && (needs.publish.result == 'success' || needs.check.outputs.web_only == 'true')
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the .dmg checksum back from B2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APP_KEY }}
          B2_ENDPOINT: ${{ vars.B2_ENDPOINT }}
          B2_BUCKET: ${{ vars.B2_BUCKET }}
        run: |
          aws s3 cp --endpoint-url "$B2_ENDPOINT" "s3://$B2_BUCKET/$B2_PREFIX/$VERSION/SHA256SUMS.txt" SHA256SUMS.txt
          SHA=$(awk -v f="Yeet-$VERSION.dmg" '$2 == f { print $1 }' SHA256SUMS.txt)
          [[ "$SHA" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::no checksum for Yeet-$VERSION.dmg in SHA256SUMS.txt"; exit 1; }
          echo "DMG_SHA256=$SHA" >> "$GITHUB_ENV"

      - name: Render website
        run: python3 scripts/render-website.py "$VERSION" "$DMG_SHA256" out/website

      - name: Deploy to the VPS (forced command → ci-deploy.sh)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          for s in DEPLOY_HOST DEPLOY_USER DEPLOY_KNOWN_HOSTS DEPLOY_SSH_KEY; do
            [[ -n "${!s}" ]] || { echo "::error::secret $s missing"; exit 1; }
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          (umask 077; printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key)
          trap 'rm -f ~/.ssh/deploy_key' EXIT
          tar -czf - -C out/website . | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "$VERSION"
