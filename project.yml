# XcodeGen spec → Yeet.xcodeproj  (generate with: xcodegen generate)
# Configurations:
#   Debug / Release / AppStore – all sandboxed (v2 ships only on the Mac App Store), -D APPSTORE
name: Yeet
options:
  bundleIdPrefix: vn.stevetran
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
  AppStore: release
settings:
  base:
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ${TEAM_ID}
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  Yeet:
    type: application
    platform: macOS
    sources:
      - path: Sources/Yeet
      - path: Support/Assets.xcassets
      - path: Support/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Support/Credits.rtf
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Yeet
        PRODUCT_BUNDLE_IDENTIFIER: vn.stevetran.yeet
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        # v2 ships one sandboxed build (Mac App Store) for every configuration.
        CODE_SIGN_ENTITLEMENTS: Support/YeetAppStore.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APPSTORE"
        ENABLE_APP_SANDBOX: YES
        ENABLE_USER_SELECTED_FILES: readwrite
        COMBINE_HIDPI_IMAGES: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
schemes:
  Yeet:
    build:
      targets:
        Yeet: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: AppStore
