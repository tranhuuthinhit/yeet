# XcodeGen spec → Yeet.xcodeproj  (generate with: xcodegen generate)
# Configurations:
#   Debug / Release  – direct build: no sandbox, Full Disk Access, runs developer CLIs
#   AppStore         – Mac App Store build: App Sandbox, folder bookmark, removal only (-D APPSTORE)
name: Yeet
options:
  bundleIdPrefix: vn.stevetran
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
  AppStore: release
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ${TEAM_ID}
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  Yeet:
    type: application
    platform: macOS
    sources:
      - path: Sources/Yeet
      - path: Support/Assets.xcassets
      - path: Support/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Yeet
        PRODUCT_BUNDLE_IDENTIFIER: vn.stevetran.yeet
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Support/Yeet.entitlements
        COMBINE_HIDPI_IMAGES: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
      configs:
        AppStore:
          CODE_SIGN_ENTITLEMENTS: Support/YeetAppStore.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: APPSTORE
          ENABLE_APP_SANDBOX: YES
          ENABLE_USER_SELECTED_FILES: readwrite
schemes:
  Yeet:
    build:
      targets:
        Yeet: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: AppStore
